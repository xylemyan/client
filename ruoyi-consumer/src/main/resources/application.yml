server:
  port: 8082  # 客户端对外端口（前端访问此端口）
  ssl:
    enabled: true
    key-store: classpath:ssl/https-client.jks
    key-store-type: JKS
    key-store-password: 123456
    key-alias: ruoyi-https
    enabled-protocols: TLSv1.2,TLSv1.3

spring:
  application:
    name: ruoyi-client
  thread:
    execution:
      threadNamePrefix: feign-
    main:
      allow-circular-references: true # 允许循环依赖
# Feign配置
feign:
  hystrix:
    enabled: false # 关闭Hystrix，否则RequestContextHolder为空（token透传失败）
    client:
      config:
        default:
          connectTimeout: 5000 # 连接超时
          readTimeout: 5000    # 读取超时
    # 显式指定拦截器，确保生效
    request-interceptors:
      - com.cruoyi.client.config.FeignAuthInterceptor
  client:
    config:
      # 全局配置（所有Feign接口生效）
      default:
        connectTimeout: 10000  # 连接超时时间（ms）
        readTimeout: 300000    # 读取超时时间（ms）- 5分钟，适配大数据量同步
        loggerLevel: FULL      # 日志级别：NONE/BASIC/HEADERS/FULL
      # 针对指定服务的配置（优先级高于全局）
      ruoyi-server:
        connectTimeout: 2000
        readTimeout: 4000
  # 启用Sentinel熔断降级（可选）
  sentinel:
    enabled: true
# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30